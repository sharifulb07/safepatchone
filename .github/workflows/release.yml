name: SafePatch release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Refuse replacement of an existing release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          tags=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if grep -Fxq -- "$TAG" <<< "$tags"; then
            echo "This tag already has a release; use a new version."
            exit 1
          fi
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-go@fba3fb4ead8c8e09a06f1d32ae5436e5818eff15
        with:
          go-version-file: go.mod
      - run: |
          go mod verify
          go test ./...
          go test -race ./...
          go vet ./...
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -shellcheck= -pyflakes= .github/workflows/release.yml

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-go@fba3fb4ead8c8e09a06f1d32ae5436e5818eff15
        with:
          go-version-file: go.mod
      - name: Package all shared commands
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=0.0.0
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            version="${REF_NAME#v}"
          fi
          go run ./tools/release -version "$version" -commit "$(git rev-parse HEAD)" -timestamp "$(git show -s --format=%cI HEAD)" -out dist
          (cd dist && sha256sum --check checksums.txt)
          mkdir inventory
          for archive in dist/*.zip; do
            unzip -q "$archive" -d "inventory/$(basename "$archive" .zip)"
          done
      - name: SBOM of every packaged binary
        uses: anchore/sbom-action@4b8c29d790e45fe4e30d1b3ecf75f20d802e5dee
        with:
          path: inventory
          syft-version: v1.51.1
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest artifacts in their build job
        id: provenance
        if: github.ref_type == 'tag'
        uses: actions/attest@60c80190bb1a4fb35e5724ede753db5656412b68
        with:
          subject-path: |
            dist/*.zip
            dist/release.json
            dist/sbom.spdx.json
      - if: github.ref_type == 'tag'
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/build-provenance.sigstore.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: macos-14
            target: darwin_arm64
          - runner: windows-2025
            target: windows_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-files
          path: dist
      - env:
          TARGET: ${{ matrix.target }}
        run: |
          cd dist
          sha256sum --check checksums.txt
          mkdir unpacked
          unzip -q safepatch_*_"$TARGET".zip -d unpacked
          version=$(jq -r .version release.json)
          commit=$(jq -r .commit release.json)
          for binary in unpacked/safepatch*; do
            chmod +x "$binary"
            "$binary" version --json | jq -e --arg version "$version" --arg commit "$commit" '.version == $version and .commit == $commit'
            "$binary" --help
          done
          cli=unpacked/safepatch
          if [[ "$TARGET" == windows_* ]]; then cli="$cli.exe"; fi
          "$cli" entitlement show --json

  images:
    if: github.ref_type == 'tag'
    needs: [build, smoke]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        command: [safepatch, safepatch-api, safepatch-worker, safepatch-collector, safepatch-mcp-gateway, safepatch-replay]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-files
          path: dist
      - name: Prepare identical Linux release binaries
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          COMMAND: ${{ matrix.command }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check checksums.txt)
          for arch in amd64 arm64; do
            mkdir -p "image/bin/linux/$arch"
            unzip -q dist/safepatch_*_linux_"$arch".zip "$COMMAND" -d "image/bin/linux/$arch"
          done
          echo "image=ghcr.io/${REPOSITORY,,}/$COMMAND" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@5ac4a31b15f1c45ec652b8af78c2096c3a08368c
      - uses: docker/login-action@0a596b2e7a325f0cedf8e9bd21ab002cbd3c9241
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820
        id: image
        with:
          context: image
          file: deploy/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
          build-args: COMMAND=${{ matrix.command }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017
        with:
          cosign-release: v3.0.6
      - name: Sign immutable image digest
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          COMMAND: ${{ matrix.command }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          mkdir receipts
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" '{image:$image,digest:$digest}' > "receipts/$COMMAND-image.json"
      - uses: actions/attest@60c80190bb1a4fb35e5724ede753db5656412b68
        id: provenance
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          COMMAND: ${{ matrix.command }}
        run: cp "$BUNDLE" "receipts/$COMMAND-image-provenance.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-${{ matrix.command }}
          path: receipts/
          if-no-files-found: error

  release:
    needs: [build, smoke, images]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          pattern: image-*
          merge-multiple: true
          path: dist
      - uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017
        with:
          cosign-release: v3.0.6
      - name: Seal release and create draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check checksums.txt
          sha256sum *.zip *.json > checksums.txt
          cosign sign-blob --yes --bundle checksums.sigstore.json checksums.txt
          cosign verify-blob --bundle checksums.sigstore.json --certificate-identity "https://github.com/$GH_REPO/.github/workflows/release.yml@refs/tags/$TAG" --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          sha256sum --check checksums.txt
          gh release create "$TAG" --draft --verify-tag --title "SafePatch $TAG" --notes "One shared release for all five editions. See docs/releases.md for verification and service composition limitations." ./*.zip ./*.json checksums.txt
