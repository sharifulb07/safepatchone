# Include in nginx's http context. Replace app.example.com and certificate paths.
# Keep API and Next.js on loopback; expose only this HTTPS listener.
# Log $uri, never $request_uri: OAuth codes and signed URLs must not reach logs.
limit_req_zone $binary_remote_addr zone=safepatch_web:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=safepatch_login:10m rate=10r/m;
log_format safepatch_web '$remote_addr [$time_local] "$request_method $uri" $status';
server {
    listen 80;
    server_name app.example.com;
    return 308 https://app.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name app.example.com;
    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/safepatch-web.log safepatch_web;
    client_max_body_size 32k;
    client_body_timeout 10s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /v1/auth/github/start {
        limit_req zone=safepatch_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host app.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        proxy_cache off;
    }
    # Provider webhooks bypass the presentation proxy and verify signatures in Go.
    location ~ ^/v1/(billing/(stripe|paddle)/webhook|integrations/github/webhook)$ {
        client_max_body_size 2m;
        limit_req zone=safepatch_web burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host app.example.com;
        proxy_read_timeout 35s;
        proxy_cache off;
    }
    location / {
        limit_req zone=safepatch_web burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host app.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 35s;
        proxy_cache off;
    }
}
