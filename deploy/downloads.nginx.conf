# Include in nginx's http context after provisioning DNS and TLS certificates.
limit_req_zone $binary_remote_addr zone=safepatch_downloads:10m rate=5r/s;
log_format safepatch_downloads '$remote_addr [$time_local] "$request_method $uri" $status';

server {
    listen 80;
    server_name downloads.safepatch.dev;
    return 308 https://downloads.safepatch.dev$request_uri;
}
server {
    listen 443 ssl;
    server_name downloads.safepatch.dev;
    ssl_certificate /etc/letsencrypt/live/downloads.safepatch.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/downloads.safepatch.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/safepatch-downloads.log safepatch_downloads;
    client_max_body_size 1k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location = / { return 302 /v1/downloads/public; }
    location ~ ^/v1/(downloads/public(/[a-zA-Z0-9_-]+)?|organizations/[a-zA-Z0-9_-]+/downloads(/[a-zA-Z0-9_-]+)?)$ {
        limit_req zone=safepatch_downloads burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host downloads.safepatch.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location / { return 404; }
}
